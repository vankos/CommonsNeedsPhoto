name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "workflow_dispatch" ] || [ -z "$VERSION" ]; then
            VERSION="$(date +%Y.%m.%d)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(echo "$VERSION" | tr -d '.')" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ env.VERSION }} -PversionCode=${{ env.VERSION_CODE }} --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/CommonsNeedsPhoto${{ env.VERSION }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommonsNeedsPhoto-${{ env.VERSION }}
          path: app/build/outputs/apk/release/CommonsNeedsPhoto${{ env.VERSION }}.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/release/CommonsNeedsPhoto${{ env.VERSION }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automatically generated release from GitHub Actions"
          draft: false
          prerelease: false
