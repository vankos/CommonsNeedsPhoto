name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

  release:
    name: Build release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "note=Signed with the project keystore." >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "note=Debug-signed release APK: the release package and name are kept, but the APK is signed with the Android debug key. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets for a properly signed release." >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; attaching the debug-signed release variant."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-release-key.jks

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +%Y.%m.%d)"
          fi
          # Android compares versionCode as an integer, so it must grow with every
          # release. Dropping the dots from the tag is not enough: 2026.11.27.4
          # becomes 202611274, ten times larger than 2026.11.28's 20261128, and
          # the installer then refuses the newer release as older. Use the date
          # digits followed by a two-digit daily sequence instead:
          # 2026.11.28 -> 2026112800, 2026.11.28.1 -> 2026112801.
          IFS='.' read -r -a PARTS <<< "$VERSION"
          DATE_CODE="${PARTS[0]}${PARTS[1]}${PARTS[2]}"
          SEQUENCE=$((10#${PARTS[3]:-0}))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(printf '%s%02d' "$DATE_CODE" "$SEQUENCE")" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PversionName=${{ env.VERSION }} -PversionCode=${{ env.VERSION_CODE }} --console=plain

      - name: Prepare APK
        id: apk
        run: |
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          DEST="app/build/outputs/apk/CommonsNeedsPhoto${VERSION}.apk"
          cp "$SOURCE" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CommonsNeedsPhoto-${{ env.VERSION }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automatically generated release from GitHub Actions.
            ${{ steps.signing.outputs.note }}
          draft: false
          prerelease: false
